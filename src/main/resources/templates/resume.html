<!DOCTYPE html>
<html lang="en" data-theme="night" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${person.name()}">Anurag Rakesh Bandhu</title>
  <meta name="description" content="One-page resume. Download PDF or LaTeX."/>
  <th:block th:replace="~{fonts :: headLinks}"/>
</head>
<body class="resume-body">
  <div class="resume-toolbar no-print">
    <div class="toolbar-row">
      <a class="chrome-back" href="/">Site</a>
      <div class="toolbar-actions">
        <a class="btn btn-ghost" href="/resume.tex" data-resume-download>Download LaTeX</a>
        <a class="btn btn-primary" href="/resume.pdf">Download PDF</a>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle day and night">◐</button>
      </div>
    </div>
    <p class="toolbar-hint">
      Use <strong>Download PDF</strong> for a clean file with no date stamp or URL.
      Browser print adds those in the corners unless you turn off <strong>Headers and footers</strong>.
    </p>
  </div>

  <article th:replace="~{fragments :: resumePaper}"></article>
  <div th:replace="~{fragments :: resumeGate}"></div>
</body>
</html>
